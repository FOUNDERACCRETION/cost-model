  - name: dft.wrong_verdict_frac
    low: 0.132
    base: 0.16
    high: 0.3434
    unit: fraction of DFT-stable verdicts that are wrong
    source_url: https://www.nature.com/articles/s41586-023-06735-9
    citations: [merchant2023gnome, an2026, szymanski2023alab]
    source_note: "PROXY: a disagreement rate between two levels of theory, NOT experimental failure.
      No source reports a direct error rate against experiment, and no source we found breaks the
      flip rate down by chemistry -- only by number of elements.
      Base 0.16 and low 0.132, both PUBLISHED and both verified 2026-10-11: GNoME reports that
      '84% of the discovered binaries and ternary materials also present negative phase-separation
      energies' and '86.8% of tested quaternaries also remain stable on the r2SCAN convex hull',
      i.e. 16% and 13.2% flip. Note these are two different tests, not one metric split by arity:
      phase-separation energy for the binaries and ternaries, r2SCAN hull position for the
      quaternaries.
      High 0.3434 is DERIVED and more loosely comparable than base and low. An et al. 2026
      (arXiv:2607.01713) report that of 166 DYNAMICALLY STABLE candidates, 109 (65.7%) have an
      E_SCAN_hull below 1 meV/atom; 57/166 = 34.3% is our subtraction, and the paper does not call
      it a flip rate. Two caveats follow: SCAN was not run on the 132 candidates eliminated
      earlier, so this is not a PBE->SCAN flip rate over all 298 PBE-stable materials, and the
      population is pre-screened on dynamical stability, which the other two endpoints are not.
      CHANGED 2026-10-11: the note previously described the An et al. figure as a PBE->SCAN flip
      rate with 109 of 166 surviving, which overstated what the source states.
      A-Lab's own attribution, for context only: 3 of 16 analysed failures were computational."
    evidence_grade: proxy

