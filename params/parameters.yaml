    source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10700133
    citations: [szymanski2023alab]
    source_note: "Derived from two A-Lab figures with a budget model: each recipe succeeds with probability q, a target gets at most B recipes, so per-target success s = 1 - (1 - q)^B and expected recipes = s / q. A-Lab's s = 36/57 and 353/57 = 6.19 recipes per target give q = 0.102 and B = 9.29. Used by the Monte Carlo and scenarios to tie recipes to success (correlation recipes_vs_success); the deterministic base case keeps A-Lab's observed 6.19."
