# ==================================================================== correlations (documentation; stage 1 does not use)
# Parameters below are NOT independent. Sampling them independently in stage 2 would produce combinations that
# cannot occur. Each entry names the parameters, the sign, why, and how stage 2 must draw them.

correlations:

  - name: recipes_vs_success
    parameters: [synth.recipes_per_target, synth.success_unconditional]
    sign: negative
    reason: "A-Lab's 6.19 recipes per target averages successes and failures. Failed targets exhaust the recipe budget, successes stop early, so a world with high success also has fewer recipes per target. High recipes with high success is not physical."
    stage2_handling: "Draw success, then recipes conditionally: recipes = success x (recipes per successful target) + (1 - success) x (recipes per failed target). Needs A-Lab's per-target recipe counts split by outcome (Supplementary data; not yet in sources/)."

  - name: filter_purity_vs_pool
    parameters:
      - gen.ion_exchange.frac_stable_strict
      - gen.ion_exchange.frac_stable_after_chgnet_filter
      - gen.ion_exchange.frac_novel_vs_mp
      - gen.ion_exchange.frac_novel_all_databases
      - gen.mattergen.frac_stable_strict
      - gen.mattergen.frac_stable_after_chgnet_filter
      - gen.mattergen.frac_novel_vs_mp
      - gen.mattergen.frac_novel_all_databases
    sign: positive within a method
    reason: "Pool stability, post-filter purity and novelty for one method come from the same Szymanski & Bartel experiment on the same generated structures. A draw with a high unfiltered stability rate but low filtered purity mixes worlds."
    stage2_handling: "Draw each method's figures jointly, ideally by bootstrapping the per-structure DFT and CHGNet results the authors publish (https://github.com/Bartel-Group/matgen_baselines), not from independent Wilson intervals."

  - name: recall_vs_purity
    parameters: [mlip.chgnet.recall, gen.ion_exchange.frac_stable_after_chgnet_filter, gen.mattergen.frac_stable_after_chgnet_filter]
    sign: constrained
    reason: "Recall and purity describe the same classifier on the same pool. Given the pool's stable fraction, they fix the pass fraction (prevalence x recall / purity), which must be <= 1. They come from different sources (Matbench vs Szymanski & Bartel), so they cannot both be exactly right."
    stage2_handling: "Reject draws whose implied pass fraction exceeds 1, and report the implied false-positive rate of accepted draws."

  - name: success_vs_novelty_worldview
    parameters: [synth.success_unconditional, novelty.science_frac, dft.wrong_verdict_frac]
    sign: positive
    reason: "Success and novelty come from the same contested re-analyses of the same experiments. A-Lab's 70% success and its novelty claim are one reading; Leeman et al.'s 5% success and zero new materials are another. Low success with high novelty mixes incompatible readings. The wrong-verdict share belongs to the same reading: A-Lab attributes only 3 of 57 failures to computation, while Leeman finds most targets are known disordered phases, i.e. the prediction was wrong."
    stage2_handling: "Do not sample independently. Report the named scenarios below next to the Monte Carlo; within the Monte Carlo, condition novelty and w on a drawn scenario."

  - name: price_basis
    parameters: [price.cpu.on_demand, price.cpu.spot, price.gpu_a100.on_demand, price.gpu_a100.spot]
    sign: positive
    reason: "CPU and GPU prices are paid on the same basis (on-demand or spot) from the same market. A spot CPU price with an on-demand GPU price is a mixed purchasing strategy."
    stage2_handling: "Draw the basis once per sample; then draw CPU and GPU prices within that basis."

  - name: labour_role
    parameters: [synth.labour_annual_salary, synth.labour_fringe_rate, synth.labour_tuition_remission, synth.labour_attempts_per_week]
    sign: tied by role
    reason: "Salary, fringe, tuition and throughput describe one person. Stage 1 fixes the role (graduate trainee) so only tuition and throughput vary. A postdoc role would change all four together."
    stage2_handling: "If a postdoc role is added, draw the role first and the four values from that role."

# ==================================================================== named scenarios (documentation; stage 1 does not run them)
# Coherent worldviews about the same contested evidence, to be reported next to the Monte Carlo. Every value
# must lie inside the record's [low, high] (tests/test_params.py). Parameters not listed stay at base.

scenarios:

  optimistic_alab:
    description: "A-Lab's own reading (Szymanski et al. 2023, as corrected 2026)."
    values:
      synth.success_unconditional: 0.631579  # 36/57, unconditional (corrected count)
      synth.recipes_per_target: 6.193         # 353/57, REPORTED by the corrected article, not derived
      dft.wrong_verdict_frac: 0.132               # lowest flip rate in sources; A-Lab: 3 of 57 targets failed computationally
      novelty.science_frac: 0.1556                # Wilson 99% upper bound on 0 of 36: the most generous rate the
                                                  # data admit, since no source publishes a nonzero count. Was 0.25,
                                                  # from an invalid subtraction of overlapping error categories.
    note: "A-Lab's correction makes no new-to-science claim ('new to the platform, not necessarily new to science'), so no A-Lab number exists for novelty; 0.1556 is the most generous rate the data admit, being the Wilson 99% upper bound on Leeman's 0 of 36. Recipes are stated explicitly rather than left to the budget-model fallback: the fallback is calibrated to reproduce 6.19 here, so the two agree, but relying on that agreement would hide the fallback if the calibration ever changed."

  middle_prein:
    description: "Prein et al. 2025, an independent automated campaign: 7 of 24 attempted targets made, one recipe per target."
    values:
      synth.success_unconditional: 0.2916666667
      synth.recipes_per_target: 1.0
      dft.wrong_verdict_frac: 0.16
      novelty.science_frac: 0.0964                # Wilson upper bound on 0/36; Prein et al. report no novelty figure
    note: "Matches the stage-1 base values."

  pessimistic_leeman:
    description: "Leeman et al. 2024's re-analysis of A-Lab."
    values:
      synth.success_unconditional: 0.051724  # 3/58, unconditional
      synth.recipes_per_target: 6.1207        # 355/58, REPORTED by the 2023 article Leeman re-analyse
      dft.wrong_verdict_frac: 0.3434              # highest flip rate in sources; Leeman: most targets are known disordered phases
      novelty.science_frac: 0.0                   # 0 of 36 new
    note: "Novelty 0 makes level 3 unbounded (no new material at any spend). That is this worldview's result, not a numerical failure.
      CHANGED 2026-10-11 (third change today): recipes were left to the budget-model fallback, which returned 9.06 at this
      success rate. That was wrong in kind, not just in value. Leeman et al. re-count the outcomes of the SAME campaign, so
      the experiment count is observed, not hypothetical: the budget model exists to tie recipes to success across worlds
      where the count is unknown, and applying it to a campaign that published its own count invents 3 extra attempts per
      target. 355/58 is the 2023 article's own pair, which is the version Leeman analyse; the corrected article's 353/57
      pair belongs to the optimistic reading. Mixing 353 with 58 would splice the two versions."

# ==================================================================== Monte Carlo (stage 2)
# Every sampled parameter has a distribution and a reason. Parameters not listed are held at base.
# Distribution types:
#   beta_counts   Jeffreys posterior Beta(k + 0.5, n - k + 0.5) for a proportion with a published count k of n.
#   triangular    (low, mode, high) = the record's (low, base, high): a sourced range with a most-likely value.
#   log_triangular  triangular in log space, for ranges spanning about 10x or more.
#   log_uniform   uniform in log space: a span with no defensible mode.
#   uniform       two published endpoints, no count and no mode.
#   bootstrap_mean  mean of a resample (with replacement) of first-hand values: cost is linear, so the
#                 uncertainty that matters is in the mean over many candidates.
#   empirical     one of a set of equally likely values.
# Joint structures (correlations block) are implemented in src/sampling.py and described under `joint`.

monte_carlo:
  n_draws: 20000
  seed: 20261010
  distributions:
    batch.n_atoms:
      type: empirical
      values: [10, 14, 16, 20, 28, 32]
      reason: "A candidate is one of the native benchmark sizes; only MLIP cost depends on it."
    mlip.chgnet.step_cost_per_atom:
      type: bootstrap_mean
      values: [0.009057, 0.005104, 0.006011, 0.003209, 0.008215, 0.005646]
      reason: "Per-structure core-s per step per atom, primary_1thread, 6 native structures (first-hand)."
    mlip.steps_per_relaxation:
      type: bootstrap_mean
      values: [18, 18, 20, 22, 25, 28, 32, 35, 39, 43, 44, 46, 63, 81]
      reason: "Every converged CHGNet and MACE relaxation (first-hand); no size dependence."
    mlip.chgnet.nonconv_frac:
      type: beta_counts
      k: 0
      n: 7
      reason: "0 of 7 benchmark relaxations hit the cap."
    mlip.chgnet.recall:
      type: triangular
      reason: "Matbench value as mode; 0.40-0.95 are plausibility bounds, not a measured interval."
    dft.cost_per_candidate:
      type: log_uniform
      reason: "Spans 3-1,000 core-h (two and a half orders of magnitude) between our measurement and MP 2012; no defensible mode."
    synth.xrd_cost_per_sample:
      type: triangular
      reason: "Three sourced fee points: self-use, internal service (mode), external."
    synth.furnace_fixed_fee:
      type: triangular
      reason: "Internal fee (mode) to industry fee."
    synth.furnace_hourly:
      type: triangular
      reason: "Internal range midpoint (mode) to industry upper rate."
    synth.labour_tuition_remission:
      type: triangular
      reason: "0 (fellowship) to the NIH compensation-cap residual, mode at the NRSA tuition cap."
    synth.indirect_rate:
      type: triangular
      reason: "NBER WP 33627: lower end of typical effective ICR rates (low), average effective rate NIH pays (mode), average negotiated rate (high)."
    synth.labour_attempts_per_week:
      type: triangular
      reason: "Liverpool estimate 10-20 per researcher-week, midpoint mode."
    synth.crucible_cost:
      type: triangular
      reason: "Three vendor prices for a 10 mL alumina crucible."
    synth.attempts_per_crucible:
      type: log_triangular
      reason: "Assumed firing life 10-100 (mode 20); spans 10x."
    synth.precursor_mass_g_per_attempt:
      type: log_triangular
      reason: "0.5-5 g (mode 1.5); spans 10x."
    synth.precursor_usd_per_g:
      type: empirical
      values: [2.1703, 4.6569, 1.3503, 7.5814, 0.5194, 0.4404]
      reason: "Blended $/g at base pack sizes for each of our six compositions (src/derive.py): the target chemistry is uncertain, not the catalogue price."
    synth.other_consumables_per_attempt:
      type: triangular
      reason: "Derived base; low without milling balls, high an assumption covering unpriced items."
    price.cpu.on_demand:
      type: triangular
      reason: "Three on-demand list prices; AWS c7i as mode."
    price.gpu_a100.on_demand:
      type: triangular
      reason: "Three A100 on-demand prices; AWS p4d as mode."
  joint:
    pools:
      reason: "Pool stability, novelty and filter purity for one method come from one Szymanski & Bartel experiment (correlation filter_purity_vs_pool)."
      method: >-
        prevalence ~ beta_counts(strict stable of 500). MP-novel share ~ beta_counts(500 of generated);
        all-database share = MP-novel share x beta_counts(absent-from-all of 500). Filter purity = enrichment x
        prevalence, with ln(enrichment) ~ Normal(ln(purity / prevalence), s), s^2 = (1 - P)/(n_P P) + (1 - pi)/(n_pi pi)
        from the two binomial samples (plus the plot-reading error for MatterGen). At low prevalence a fixed
        classifier's enrichment is roughly constant, so purity moves with the pool's stable fraction.
      counts:
        ion_exchange: {stable: 46, n_stable: 500, generated: 691, all_db: 434, purity: 0.152, n_purity: 300, plot_error: 0.0}
        mattergen: {stable: 15, n_stable: 500, generated: 545, all_db: 453, purity: 0.038, n_purity: 300, plot_error: 0.003}
    worldview:
      reason: "Synthesis success, novelty and the wrong-verdict share come from the same contested re-analyses (correlation success_vs_novelty_worldview). Each draw picks one reading and draws all three from it."
      weights: {optimistic_alab: 0.3333333333333333, middle_prein: 0.3333333333333333, pessimistic_leeman: 0.3333333333333333}
      weights_reason: "ASSUMPTION: equal weight; no basis for preferring a reading. Named-scenario results are reported alongside so readers can apply their own weights."
      headline: "No single point estimate is headlined. The headline is the cost conditional on each reading, because which reading is right moves the cost far more than any pipeline choice does, and the three sources differ in standing (see each reading's source)."
      weight_sensitivity:
        - {optimistic_alab: 0.5, middle_prein: 0.25, pessimistic_leeman: 0.25}
        - {optimistic_alab: 0.25, middle_prein: 0.25, pessimistic_leeman: 0.5}
        - {optimistic_alab: 0.5, middle_prein: 0.5, pessimistic_leeman: 0.0}
        - {optimistic_alab: 0.0, middle_prein: 1.0, pessimistic_leeman: 0.0}
      readings:
        optimistic_alab:
          source: "Szymanski et al., Nature (2023), corrected January 2026"
          standing: "peer-reviewed (Nature), 57 targets; the experiment Leeman et al. re-analyse"
          success: {type: beta_counts, k: 36, n: 57}   # unconditional (changed 2026-10-11 from 38/54)
          recipes: 6.193                                # 353/57, reported by the corrected article. Stated rather than
                                                        # left to the budget-model fallback: the fallback is calibrated on
                                                        # this very pair, so it agrees here by construction, and relying on
                                                        # that agreement would hide the fallback if the calibration moved.
          novelty: {type: beta_counts, k: 9, n: 36}
          wrong_verdict: {type: uniform, low: 0.132, high: 0.16}
        middle_prein:
          source: "Prein et al., arXiv 2511.01790 (2025)"
          standing: "arXiv preprint, no journal reference or venue listed as of 2026-10-10, 24 targets attempted; a separate campaign, one recipe per target"
          success: {type: beta_counts, k: 7, n: 24}   # unconditional: 24 attempted, 8 fused to crucibles and uncharacterisable, 7 of the 16 characterised made the target phase. 7/16 = 43.8% conditions on a characterisable product and is NOT comparable with the other two readings.
          recipes: 1.0                                  # the campaign attempted each target once ("only one experiment per target"); its own multiplicity, not A-Lab's budget model, which would imply ~8.0 here
          novelty: {type: beta_counts, k: 0, n: 36}
          wrong_verdict: {type: uniform, low: 0.132, high: 0.16}
        pessimistic_leeman:
          source: "Leeman et al., PRX Energy (2024)"
          standing: "peer-reviewed (PRX Energy), re-analysis of the same A-Lab experiment (58 targets)"
          success: {type: beta_counts, k: 3, n: 58}
          recipes: 6.1207                               # 355/58, reported by the 2023 article Leeman re-analyse.
                                                        # CHANGED 2026-10-11: this reading used the budget-model fallback,
                                                        # which returned 9.07 at a 3/58 success rate. Wrong in kind: Leeman
                                                        # re-count the SAME campaign, so its experiment count is observed,
                                                        # and the fallback exists for readings where it is not. 355 and 58
                                                        # are the 2023 article's own pair; 353/57 is the corrected one and
                                                        # belongs to the optimistic reading. Mixing them splices versions.
          novelty: {type: beta_counts, k: 0, n: 36}
          wrong_verdict: {type: beta_counts, k: 57, n: 166}
      notes: "A-Lab's novelty uses Leeman's 9 of 36 not attributed to known phases (A-Lab's correction makes no new-to-science claim). Prein reports no novelty figure and inherits the only count, 0 of 36. Wrong-verdict share: GNoME's 13.2-16% flip range (no counts) for A-Lab and Prein; An et al.'s 57 of 166 flips for Leeman."
    recipes:
      reason: "Recipes per target fall as per-target success rises (correlation recipes_vs_success)."
      method: "recipes = p / q with q = 1 - (1 - p)^(1 / B), p = unconditional success, B = synth.recipe_budget. Reproduces A-Lab's 6.19 at p = 36/57. CHANGED 2026-10-11: p was (1 - wrong verdict share) x success, which both double-charged computational failure and contradicted this note's own calibration point."
