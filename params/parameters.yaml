    citations: [szymanski2025baselines]
    source_note: Szymanski & Bartel 2025 generated and DFT-checked 500 structures per method. Used as the batch over which fixed cost per chemistry is amortised. It is per method, not per chemistry.
    evidence_grade: proxy

  - name: batch.n_atoms
    low: 10
    base: 18
    high: 32
    unit: atoms per cell
    source_url: data/mlip_benchmark/timings.csv
    source_note: Median, min and max of the 6 native benchmark candidates (10, 14, 16, 20, 28, 32 atoms). Used only by the first-hand cost-vs-size paths.
    evidence_grade: first_hand

