  - name: synth.indirect_rate
    low: 0.25
    base: 0.42
    high: 0.45
    unit: fraction of the indirect-cost base (total direct costs when indirect_base = total_direct)
    source_url: https://www.nber.org/papers/w33627
    citations: [azoulay2025icr, cfr200468]
    source_note: "Azoulay, Gross & Sampat (2025), 'Indirect Cost Recovery in U.S. Innovation Policy', NBER WP 33627. Base: the EFFECTIVE indirect cost recovery (ICR) rate, what NIH actually pays, averages 42% (abstract; Table 1, 2024: mean 42%, median 40%, s.d. 10%, min 14%, max 81%). High: the NEGOTIATED ICR rate, the ceiling an institution may charge, averages 58% (abstract; Table 1, 2024: mean 58%, median 56%). Low: 'effective rates in practice are generally between 25% and 45%' (section 3.3, p. 17), lower end. Applying the negotiated 58% would overstate indirect cost by about a third. Population: the underlying data are NIH indirect-cost records for 354 NIH grantee institutions (69% universities, 18% independent hospitals, 13% research institutes; NIH RePORTER since 2006 and the CGAF before), not a census of US universities. The effective rate is NIH ICR paid divided by direct costs for the institution as a whole, a total-direct-cost denominator, whereas the model applies it to an MTDC-like base that excludes tuition and service fees; on a narrower base the true rate per base dollar is somewhat higher, so 42% leans low. Vocabulary: the paper's headline term is 'indirect cost recovery'; it uses 'F&A rate' only for the negotiated agreement. Used only when cost_basis = funder. Base of the charge: labour, fringe, crucibles, precursors and other consumables (MTDC includes salaries, fringe, materials, supplies and services and excludes tuition remission, 2 CFR 200.1, https://www.law.cornell.edu/cfr/text/2/200.1). XRD and furnace recharge fees are left out of the base by default: service-centre rates 'must normally consist of its direct costs and an allocable share of all indirect costs' (2 CFR 200.468(b)(2), https://www.law.cornell.edu/cfr/text/2/200.468), so indirect cost on top would double-count. Institutional practice varies; choices.fa_base_includes_service_fees reverses this. Negotiated-rate examples, not used: Caltech FY2026 on-campus 70% (https://www.fundingopportunities.caltech.edu/static/guides/FY26_Rate_Memo.pdf), Stanford 54% (FY2025-26), Michigan 56% (FY2025-29), MIT 62% (FY2026). The 2025 NIH 15% cap was vacated (First Circuit, Jan 2026) and is not used."
    evidence_grade: published

