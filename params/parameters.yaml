    citations: [szymanski2023alab]
    source_note: "CAMPAIGN-REPORTED multiplicity, not a derived quantity. BASE 1.0: Prein et al.
      (arXiv:2511.01790) attempted each of 24 targets once -- the middle reading, which the
      deterministic base case follows, so the base case is now one campaign throughout rather than
      Prein's success rate paired with A-Lab's recipe budget. HIGH 6.193: A-Lab.
      CHANGED 2026-10-11 (second change today): base was 6.193, which charged the middle reading
      about eight recipes per target for a campaign that reports one.
      A-Lab detail, VERIFIED against both versions. The CORRECTED article prints 353 recipes
      and 57 targets: 353/57 = 6.193, the base. The ORIGINAL 2023 article prints 355 recipes and 58 targets
      (eScholarship qt4w49b5cb): 355/58 = 6.1207, the low. The 355 -> 353 change is silent -- the Author
      Correction notice never mentions the recipe count -- so both pairings are defensible and the range
      spans them. CHANGED 2026-10-11: high was 6.228 = 355/57, which paired the ORIGINAL numerator with the
      CORRECTED denominator. That is a cross-version splice and was never a real reading; the original
      pairing is LOWER than the corrected one, so the alternative is a low endpoint, not a high one."
    evidence_grade: derived

  - name: synth.success_unconditional
    low: 0.051724
    base: 0.2916666667
    high: 0.631579
    unit: fraction of targets made as the target phase (unconditional, as the campaign reports it)
    source_url: https://arxiv.org/html/2511.01790v1
    citations: [prein2025, szymanski2023alab, szymanski2026correction, leeman2024, chen2024jacs]
    source_note: "UNCONDITIONAL rates throughout, as each campaign reports them. Base: Prein et al. 2025, 7/24 = 0.29167 unconditional (24 targets attempted; 8 fused to their crucibles and could not be characterised; 7 of the remaining 16 formed the target phase). CHANGED 2026-10-11: was 7/16 = 0.4375, which conditions on a characterisable product and so was not comparable with the other two readings, both of which count against targets attempted. High: A-Lab corrected, 36/57 = 0.6316 (https://pmc.ncbi.nlm.nih.gov/articles/PMC10700133). Low: Leeman et al. 2024, 3/58 = 0.05172 (https://par.nsf.gov/servlets/purl/10532478). Other: Prein 7/24 = 29% counting uncharacterisable; Chen et al. 2024, 1/4. CHANGED 2026-10-11: was 'given the DFT verdict is right', with high = 38/54 = 0.7037 (computational failures removed from the denominator AND the two manual-intervention successes added) and the model then dividing all three readings by (1 - w). Only the optimistic reading had been conditioned, so the middle and pessimistic branches were charged computational failure twice. All three are now unconditional and (1 - w) no longer enters the synthesis pass rate. The A-Lab target-level crosswalk is still PENDING, so 36/57 is a proposed baseline, not a settled count."
    evidence_grade: published
    change_note: "CHANGED 2026-10-11: high was 0.58, the NEGOTIATED average. That is a different quantity from the effective rate and lies outside the 25-45% effective range the same source gives, so it is not an upper bound on an effective rate. High is now 0.45, the top of the effective range; 58% is retained as the negotiated_rate_scenario, clearly labelled."

