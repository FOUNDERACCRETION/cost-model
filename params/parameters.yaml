    source_note: "Base: Fisherbrand 10 mL alumina, 99.7%, list $69.75 (its $1.00 web price looks like an error). Low: CP Lab Safety 10 mL, $37.85 (https://www.cplabsafety.com/high-alumina-crucible-cylindrical-form-10ml-each/un-jay010; not found at other vendors in a 2026-10-10 check). High: CoorsTek 10 mL cylindrical, 99.8%, $156.10 (https://www.fishersci.com/shop/products/x/0822612C)."
    evidence_grade: published

  - name: synth.attempts_per_crucible
    low: 10
    base: 20
    high: 100
    unit: firings per crucible
    source_url: https://www.mdpi.com/1996-1944/16/2/653
    citations: [szymanski2023alab]
    source_note: "ASSUMPTION; no published firing life for small lab alumina crucibles. Base 20: midpoint of the 10-30 cycle life of cordierite-mullite saggars in LiCoO2 calcination (proxy, read from a search snippet). Lithium carbonate melts corrode alumina with no passivation (https://patents.justia.com/patent/11180377), and half our compositions contain Li, so the low end is 10. High 100: reuse with non-reactive chemistries. A-Lab lost ~0.5% of samples to broken crucibles (SI Note 10), which bounds breakage, not wear."
    evidence_grade: assumption

  - name: synth.precursor_mass_g_per_attempt
    low: 0.5
    base: 1.5
    high: 5
    unit: g of precursor mix per attempt
    source_url: https://arxiv.org/abs/2501.03165
    citations: [szymanski2023alab]
    source_note: "No source gives a per-attempt mass; A-Lab says only 'multigram sample quantities' (https://pmc.ncbi.nlm.nih.gov/articles/PMC10700133). Base (proxy): ~1.5 g manual samples (Na-superionic paper, SI). Low (proxy): 'nominal 0.5 g sample' in the Precursor Genome air-sensitivity test (https://arxiv.org/pdf/2607.09903); XRD needs > 100 mg (https://arxiv.org/pdf/2609.29344). High (assumption): 5 g as an upper reading of 'multigram'. Unverified, not used: DASH thesis 'up to 1.8 g'."
    evidence_grade: proxy

  - name: synth.precursor_usd_per_g
    low: 0.1973
    base: 1.760
    high: 9.388
    unit: USD per g of stoichiometric precursor mix
    source_url: data/precursors/fisher_prices_2026-10-10.csv
    source_note: "Derived by src/derive.py from Fisher Scientific US list prices fetched 2026-10-10 (catalogue numbers and URLs in the CSV; USD, visible without login; contract prices may be lower) and the routes in data/precursors/routes.csv for our six compositions. Per target, precursors are mixed in stoichiometric mass. Low: cheapest target (Li2MnSiO4) at the largest pack. Base: median target at the smallest pack of >= 100 g. High: dearest target (BaTiS3) at the smallest pack. Rare and transition-metal precursors dominate: In2O3 5.92-10.95 $/g, BaS 10.70-12.80, MnF2 2.96-5.11, against ZnO 0.06-0.33 and Li2CO3 0.37-0.82. The TiSiN2 and BaTiS3 routes are cost proxies (no TiN or TiS2 price). Sigma-Aldrich (A-Lab's supplier) blocked fetching. Not modelled: buying a whole pack for a few grams, which raises cost per attempt for small campaigns."
    evidence_grade: derived

  - name: synth.other_consumables_per_attempt
    low: 1.71
    base: 5.58
    high: 25
    unit: USD per attempt
    source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10700133
    citations: [szymanski2023alab]
    source_note: "A-Lab lists its consumables as 'plastic vials, ZrO2 balls and crucibles' and mixes with ethanol and 'ten 5-mm ZrO2 balls'; no costs are published. Base (derived, Fisher US list prices): ethanol 1 mL (ASTRAL robot volume, https://arxiv.org/pdf/2304.00743) at $267.50/L = 0.27; three weighing dishes at $147.50/500 = 0.89; one pair of nitrile gloves at $27.75/100 = 0.56; ten 5-mm YSZ balls, 3.93 g at density 6.0 g/cm3 (assumption) and $246.50/250 g = 3.87 if single use. Low: balls reused, 1.71. High (assumption): 25, for the unpriced items: plastic vials, glovebox consumables for air-sensitive work, agate mortar wear, sieves. XRD sample holders are reused (A-Lab SI) and not charged."
    evidence_grade: derived

  # ------------------------------------------------------------------ novelty to science

  - name: novelty.science_frac
    low: 0.0
    base: 0.0964
    high: 0.1556
    unit: fraction of synthesised, database-novel targets that are new to science
    source_url: https://par.nsf.gov/servlets/purl/10532478
    citations: [leeman2024, szymanski2026correction]
    source_note: "NO PUBLISHED NONZERO COUNT EXISTS for this campaign. Leeman et al. state that
      'none of the materials produced by A-lab were new', and that the three they regard as
      correctly synthesised -- MnAgO2, Y3In2Ga3O12, CaFe2(PO4)2O -- 'have been reported'. The
      A-Lab correction makes no new-to-science claim: 'new to the platform, not necessarily new
      to science' (https://pmc.ncbi.nlm.nih.gov/articles/PMC12872444). So every value here but
      the low one is a statistical bound on a zero count, not a count.
      Low 0.0 = the published verdict. Base 0.0964 = Wilson 95% upper bound on 0 of 36. High
      0.1556 = Wilson 99% upper bound on the same. Both bounds make cost per NEW material
      optimistic, since a higher novelty share divides the cost.
      CHANGED 2026-10-11: high was 0.25, derived as '9/36 not attributed to known or disordered
      phases' by subtracting Leeman's error categories from 36. That subtraction is invalid --
      the categories OVERLAP by construction ('Compounds can have several errors'): very poor fit
      18/36, prediction changed to match 8/36, no evidence of predicted ordering 24/36, already
      reported 3/36, summing to 53. Leeman report that 35 of the 36 carry at least one error
      type, so the residual is 1, not 9, and that one is CaFe2(PO4)2O, which they class as
      already reported. Verified against the PRX Energy text 2026-10-11."
    evidence_grade: derived

