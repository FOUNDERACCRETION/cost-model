# Parameters for the cost model. Every number the model uses is here, as one record.
#
# Record fields
#   name           dotted identifier used by src/params.py
#   low/base/high  bounds on the PARAMETER VALUE (not on the resulting cost: a high
#                  throughput, for example, gives a low cost)
#   unit
#   source_url     a URL, or a repo-relative path for first-hand benchmark data
#   citations      (optional) bib keys in paper/references.bib for the record's source(s); the single source of
#                  bibliographic truth. tests/test_citations.py fails if a key does not resolve.
#   source_note    where in the source, and any arithmetic done
#   evidence_grade one of
#       first_hand   measured by us (data/), on a noisy, unusual platform (ARM64 laptop, WSL2)
#       published    stated in the source
#       derived      arithmetic on published numbers, shown in source_note
#       proxy        a published number for a related, not identical, quantity
#       assumption   a modelling convention with no source
#       missing      no source found; placeholder value, flagged in the README
#   role           (optional) primary | first_hand_comparison | cross_check
#                  cross_check records are not used by the model; they test it.
#
# Binomial ranges "Wilson 95%" are computed by scripts/derive_benchmark_params.py.
# Benchmark-derived values are checked against the raw data by tests/test_traceability.py.
# Tables: sources/p1-compute-parameters.md, sources/p1-synthesis-parameters.md
# (first pass, read through a web-fetch summary; every URL still needs checking by eye).

choices:
  # Candidate pool screened by pipelines A and B (charged its generation cost, like C).
  pool_method: ion_exchange
  # Generator used by pipeline C (charged generation cost). Selectable: ion_exchange, mattergen.
  generator_c: mattergen
  stability_threshold: strict        # strict | 100meV
  mlip_model: chgnet                 # chgnet | mace-mp-0 | m3gnet
  dft_cost_basis: span               # span (primary: 3-1,000 core-h) | first_hand (size-dependent)
  mlip_filter_basis: measured        # measured (S&B post-filter purity; CHGNet only) | matbench (recall + FPR)
  price_basis: on_demand             # on_demand | spot
  # Whose cost: "funder" = full cost to the research funder, including institutional F&A (default; the
  # question is the resource cost of a material, and F&A pays for real space, utilities and administration);
  # "bench" = direct costs only, as a lab's own budget sees them. base_case.py prints both.
  cost_basis: funder                 # funder | bench
  # Put XRD and furnace recharge fees inside the F&A base? Applies only when indirect_base = mtdc.
  # Default no: recharge rates already include the service centre's share of indirect costs
  # (2 CFR 200.468(b)(2)). We treat that as an accounting convention, not a demonstrated fact:
  # the rule does not establish that a given facility's schedule absorbs the same cost pools an
  # institution-wide rate covers, and we have not inspected those pools. A reviewer may reject it.
  fa_base_includes_service_fees: false
  # Which base the indirect rate is applied to. The EFFECTIVE rate (42%) is defined by its source as
  # recovered indirect cost divided by TOTAL DIRECT COSTS, so pairing it with a narrowed base is a
  # rate/base mismatch. Default is now the matched pairing.
  #   total_direct  effective rate on all direct costs incl. service fees and tuition  (matched; default)
  #   mtdc          effective rate on an MTDC-like base, tuition always excluded, fees per the flag above
  #                 (the pre-2026-10-11 behaviour; retained as an accounting scenario, not a definition)
  indirect_base: total_direct        # total_direct | mtdc

